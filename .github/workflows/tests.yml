# CI exists mainly to run the POSIX sandbox.
#
# `tools/code_exec_posix.py` was written on a Windows machine with no Linux,
# no WSL and no container runtime, so it had never been executed at all. A
# runner that only works on one laptop also makes the coding category
# unreproducible, which fails this project's own bar. Every push now runs the
# whole suite on Linux as well as Windows.
#
# Split into two jobs on purpose. `task_suite` and `tools` are stdlib plus
# pytest, so they install in seconds and run on both platforms; only
# `transformer_scratch` needs torch, and it is platform-agnostic, so it runs
# once on Linux with the CPU wheel rather than pulling ~2.5GB of CUDA wheels
# onto both runners for no benefit.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  suite-and-tools:
    name: task_suite + tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel Linux because Windows failed, or vice versa: when these
      # two disagree, the disagreement is the result worth seeing.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # For tests/test_middle_layer_parity.py, which builds the real binary and
      # compares its episodes with the Python loop's.
      - uses: actions/setup-go@v5
        with:
          go-version-file: middle-layer/go.mod
          cache-dependency-path: middle-layer/go.sum

      - name: Install test dependencies
        # Deliberately not requirements.txt: it pins a CUDA torch build that
        # no runner can use, and nothing under task_suite/ or tools/ imports
        # torch at all. fastapi and httpx are for `backend`, whose tests drive
        # the HTTP app against a scripted engine with no model behind it.
        # uvicorn runs that same app on a real port for the parity test.
        run: python -m pip install --upgrade pip pytest fastapi httpx uvicorn

      - name: Report the sandbox backend and what it confines
        # Also does the one-time setup, which on Windows is a ~90s icacls pass
        # granting the AppContainer read access to the interpreter. Runners are
        # fresh every time, so this is paid on every Windows run.
        run: python -m tools.code_exec --setup

      - name: Run tests
        # `tests/` is the agent loop. It runs here, with no torch and no GPU,
        # because `baseline_agent` keeps transformers inside `HFPolicy.__init__`
        # and the loop is driven by scripted policies - which is the whole
        # reason it was written that way.
        #
        # `rl_training` runs here for the same reason and as the same check:
        # its transcript masking and its advantage arithmetic are the parts
        # most likely to be quietly wrong, and neither needs a tensor. If a
        # torch import ever creeps into them, this job is what notices. The
        # parts that do need torch skip here and run in the job below.
        env:
          # The parity test skips where Go is absent. Here that would mean this
          # file is broken, and it would look exactly like a pass.
          FORGE_REQUIRE_GO: "1"
        run: python -m pytest task_suite tools tests rl_training eval backend -q

  middle-layer:
    name: middle-layer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: middle-layer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: middle-layer/go.mod
          cache-dependency-path: middle-layer/go.sum

      - name: Check formatting
        # Linux only: a Windows checkout can have CRLF line endings.
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"

      - run: go vet ./...

      - name: Run tests
        # The race detector needs cgo, which the Windows runner is not set up
        # for. Linux runs it, and the code it checks is not platform-specific.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            go test -race -count=1 ./...
          else
            go test -count=1 ./...
          fi

  frontend:
    # Linux only: nothing in the page is platform-specific. Its tests read
    # src/test/wire.json, which tests/test_frontend_wire.py (in the job above,
    # on both platforms) checks against what the real middle layer sends, so a
    # change to the wire format fails one side or the other.
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  transformer:
    name: transformer_scratch + GRPO objective (torch, CPU)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        # `rl_training` again, this time with torch present, so the GRPO
        # objective is actually exercised: the chunked backward is checked
        # against a naive reference implementation on a toy model. That
        # equivalence is the claim the 8GB memory design rests on, and CPU is
        # enough to check the arithmetic half of it. The memory half needs the
        # real card and lives in `rl_training/measure_budget.py`.
        run: python -m pytest transformer_scratch rl_training -q
